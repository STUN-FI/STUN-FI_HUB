<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>

    <link rel="shortcut icon" href="img/Favicon.png" type="image/x-icon">
<link rel='stylesheet' href='styles.css'>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <style>
    :root {
      --accent: #66cccc;
      --accent-hover: #54b8b8;
      --bg: #0f172a;
      --card: rgba(255,255,255,0.06);
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(20px);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: block;
      object-fit: cover;
      background: rgba(255,255,255,0.08);
    }

    h2 {
      margin: 10px 0;
      font-size: 2rem;
    }

    .motto {
      color: var(--muted);
      margin-bottom: 20px;
      min-height: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      min-height: 20px;
      color: var(--muted);
    }

     #preloader {
      position: fixed;
      inset: 0;
      background: #081224;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #preloader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-wrap {
      text-align: center;
      padding: 20px;
    }

    .preloader-logo {
      width: 120px;
      max-width: 100%;
      margin-bottom: 18px;
      animation: pulseLogo 1.4s ease-in-out infinite;
    }

    .spinner {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.15);
      border-top: 4px solid var(--accent);
      animation: spin 0.9s linear infinite;
    }

    .loader-wrap p {
      margin: 0;
      color: #cbd5e1;
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseLogo {
      0%, 100% {
        transform: scale(1);
        opacity: 0.92;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="loader-wrap">
      <img src="img/WHITE PNG STUNFI.png" alt="STUN-FI Logo" class="preloader-logo">
      <!-- <div class="spinner"></div> -->
      <!-- <p>Loading portal...</p> -->
    </div>
  </div>
<div class="card">
  <img id="logo" class="logo" src="" alt="Admin Logo">
  <h2>Admin Login</h2>
  <p class="motto">Sign in to manage all schools on the STUN-FI platform.</p>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">
  <label style="display:flex; gap:8px; align-items:center; margin-top:8px;">
  <input type="checkbox" onclick="togglePassword('password')" style="width:auto;">
    Show password
  </label>

  <button onclick="login()">Login</button>

  <p id="status"></p>
</div>

<script>

  function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    input.type = input.type === "password" ? "text" : "password";
  }

  function createFallbackLogo(name, color) {
    const initials = (name || "Admin")
      .split(" ")
      .filter(Boolean)
      .slice(0, 2)
      .map(part => part[0].toUpperCase())
      .join("");

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <rect width="100%" height="100%" fill="${color}"/>
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="62" fill="white" font-weight="bold">${initials}</text>
      </svg>
    `;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  const API_BASE = (() => {
    if (window.location.protocol === "file:") {
      return "http://localhost:3000";
    }
    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
      return window.location.port === "3000" ? "" : "http://localhost:3000";
    }
    return "http://localhost:3000";
  })();

  function api(path) {
    return `${API_BASE}${path}`;
  }

  document.getElementById("logo").src = "img/WHITE PNG STUNFI.png";

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const status = document.getElementById("status");

    status.innerText = "";

    if (!email || !password) {
      status.innerText = "Please fill all fields";
      return;
    }

    try {
      const response = await fetch(api("/admin-login"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem("isAdmin", "true");
        localStorage.setItem("adminName", data.admin?.name || "Super Admin");
        window.location.href = "admin-dashboard.html";
      } else {
        status.innerText = data.message || "Login failed";
      }
    } catch (error) {
      console.log(error);
      status.innerText = "Error connecting to server";
    }
  }

   window.addEventListener("load", () => {
      if (localStorage.getItem("isAdmin") === "true") {
        window.location.href = "admin-dashboard.html";
        return;
      }

      const preloader = document.getElementById("preloader");
      if (!preloader) return;

      setTimeout(() => {
        preloader.classList.add("hide");
        setTimeout(() => preloader.remove(), 500);
      }, 700);
    });
</script>

  <script src="common.js"></script>
</body>
</html>
