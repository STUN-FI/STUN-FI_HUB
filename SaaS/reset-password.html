<!DOCTYPE html>
<html>
<head>student 
  <title>STUN-FI HUB | Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="img/Favicon.png?v=2" type="image/png" sizes="any">
    <link rel="shortcut icon" href="img/Favicon.png?v=2" type="image/x-icon">
<link rel='stylesheet' href='styles.css'>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <style>
    :root {
      --accent: #66cccc;
      --accent-hover: #54b8b8;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d8dee8;
      --danger: #ef4444;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-radius: 22px;
      padding: 34px 28px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .icon {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(102, 204, 204, 0.14);
      color: var(--accent);
      font-size: 38px;
      font-weight: bold;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .field {
      text-align: left;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(102, 204, 204, 0.16);
    }

    button {
      width: 100%;
      border: none;
      background: var(--accent);
      color: white;
      padding: 14px 16px;
      border-radius: 13px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s ease;
      margin-top: 6px;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    #msg {
      margin-top: 16px;
      min-height: 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .success {
      color: var(--success);
    }

    .error {
      color: var(--danger);
    }

    .links {
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .small {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
      }

      h2 {
        font-size: 26px;
      }
    }
  </style>
  <script src="js/config.js"></script>
  <script src="js/global-loader.js"></script>
</head>

<body>

  <div class="card">
    <div class="icon"><ion-icon name="key-outline"></ion-icon></div>

    <h2>Reset Password</h2>
    <p class="sub">
      Create a new password for your account. Make sure it is strong and easy for you to remember.
    </p>

    <div class="field">
      <label>New Password</label>
      <input type="password" id="password" placeholder="Enter new password">
      <label style="display:flex; gap:8px; align-items:center; margin-top:8px;">
      <input type="checkbox" onclick="togglePassword('password')" style="width:auto;">
      Show password
      </label>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
      <label style="display:flex; gap:8px; align-items:center; margin-top:8px;">
      <input type="checkbox" onclick="togglePassword('confirmPassword')" style="width:auto;">
      Show confirm password
    </label>
    </div>

    <button id="resetBtn" onclick="resetPassword()">Reset Password</button>

    <p id="msg"></p>

    <div class="links">
      Remembered your password?
      <a id="loginLink" href="school-login.html">Login here</a>
    </div>

    <p class="small">STUN-FI School Portal</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const accountType = params.get("type")?.toLowerCase();
    const validTypes = ["student", "teacher", "school"];
    const resolvedType = validTypes.includes(accountType) ? accountType : null;

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === "password" ? "text" : "password";
    }

    function updateLoginLink() {
      const loginLink = document.getElementById("loginLink");
      if (!loginLink) return;
      if (resolvedType === "student") {
        loginLink.href = "student-login.html";
      } else if (resolvedType === "teacher") {
        loginLink.href = "teacher-login.html";
      } else {
        loginLink.href = "login.html";
      }
    }

    updateLoginLink();

    async function resetPassword() {
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("resetBtn");

      msg.className = "";
      msg.innerText = "";

        if (!resolvedType) {
        msg.className = "error";
        msg.innerText = "Invalid or missing reset account type. Use the link sent to your student, teacher, or school email.";
        return;
      }

      if (!token) {
        msg.className = "error";
        msg.innerText = "Invalid or missing reset token.";
        return;
      }

      if (!password || !confirmPassword) {
        msg.className = "error";
        msg.innerText = "Please fill in both password fields.";
        return;
      }

      if (password.length < 6) {
        msg.className = "error";
        msg.innerText = "Password must be at least 6 characters.";
        return;
      }

      if (password !== confirmPassword) {
        msg.className = "error";
        msg.innerText = "Passwords do not match.";
        return;
      }

      try {
        btn.disabled = true;
        btn.innerText = "Resetting...";

        window.showLoader?.();

        const res = await fetch(window.API_BASE + `/reset-password/${resolvedType}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ token, password })
        });

        const data = await res.json();

        if (res.ok) {
          msg.className = "success";
          msg.innerText = data.message || "Password reset successful. Redirecting...";

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1800);
        } else {
          window.hideLoader?.();
          msg.className = "error";
          msg.innerText = data.message || "Password reset failed.";
        }

      } catch (error) {
        window.hideLoader?.();
        console.log(error);
        msg.className = "error";
        msg.innerText = "Error connecting to server.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Reset Password";
      }
    }
  </script>

  <script src="common.js"></script>
</body>
</html>
